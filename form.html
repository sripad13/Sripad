<!doctype html>
<html lang="en" data-theme="dark">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KQTR53TG03"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-KQTR53TG03');</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Sripad Kilikar</title>
<meta name="description" content="Send Sripad Kilikar a message about your project.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://work.falsewinger.com/form">
<link rel="icon" href="/assets/img/favicon-face-64.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#101012;--bg2:#151518;--card:#1c1c20;--card2:#232328;--text:#e9e6e1;--head:#f7f4ef;--muted:#a7a19b;--line:#39363a;--accent:#c8ff00;--accent-soft:rgba(200,255,0,.13);--accent-ink:#111407;--shadow:0 22px 70px rgba(0,0,0,.24);--display:'Barlow Condensed',Impact,sans-serif;--body:'Plus Jakarta Sans',sans-serif;--mono:'DM Mono',monospace;--label:'Manrope','Plus Jakarta Sans',sans-serif}
:root[data-theme="light"]{color-scheme:light;--bg:#f1eee8;--bg2:#e9e5dd;--card:#fbfaf7;--card2:#f3f0ea;--text:#373330;--head:#181615;--muted:#77716c;--line:#d8d1c8;--accent:#638b00;--accent-soft:rgba(99,139,0,.11);--accent-ink:#fffdf5;--shadow:0 18px 50px rgba(65,48,39,.08)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:background .3s,color .3s}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:820px;margin:0 auto;padding-block:32px 60px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;border:1px solid var(--line);color:var(--head);font-family:var(--label);font-weight:700;font-size:14px;text-decoration:none}
.back:hover{border-color:var(--accent);color:var(--accent)}
.theme-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:none;color:var(--head);cursor:pointer}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.theme-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme-btn .sun{display:none}
:root[data-theme="light"] .theme-btn .sun{display:block}
:root[data-theme="light"] .theme-btn .moon{display:none}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,6vw,64px);line-height:1;letter-spacing:-.01em;color:var(--head);margin:8px 0 0;text-transform:uppercase}
.lead{color:var(--muted);margin:0;max-width:60ch}
.frame{background:var(--card);border:1px solid var(--line);border-radius:28px 0 28px 28px;box-shadow:var(--shadow);padding:12px;overflow:hidden}
.cf{display:flex;flex-direction:column;gap:18px;padding:28px}
.cf label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.cf input,.cf textarea{font:inherit;font-size:15px;color:var(--head);background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;width:100%}
.cf input:focus,.cf textarea:focus{outline:none;border-color:var(--accent)}
.cf textarea{min-height:150px;resize:vertical}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;overflow:hidden}
.actions{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.send{font-family:var(--label);font-weight:800;font-size:16px;padding:15px 30px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.send:hover{filter:brightness(1.08)}
.send:disabled{opacity:.6;cursor:default}
.status{margin:0;font-size:14px;color:var(--muted)}
@media (max-width:720px){h1{font-size:44px}.cf{padding:20px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <a class="back" href="/#contact">&larr; Back to portfolio</a>
    <button type="button" class="theme-btn" id="theme-toggle" aria-label="Toggle light and dark theme">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <h1>Let&#x27;s work together</h1>
  <form class="frame cf" id="contact-form" novalidate>
    <label class="hp" aria-hidden="true">Leave this field empty<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
    <label>Name<input name="entry.581627351" required maxlength="200" autocomplete="name"></label>
    <label>Email<input type="email" name="entry.1393482793" required maxlength="200" autocomplete="email"></label>
    <label>Company name<input name="entry.1542931193" maxlength="200" autocomplete="organization"></label>
    <label>Message<textarea name="entry.1928615175" required maxlength="3000" rows="6"></textarea></label>
    <div class="actions">
      <button type="submit" class="send">Send message</button>
      <p class="status" role="status" aria-live="polite"></p>
    </div>
  </form>
</main>
<script>
(function(){
 const root=document.documentElement, toggle=document.getElementById('theme-toggle');
 try{const stored=localStorage.getItem('sk-theme');if(stored==='light'||stored==='dark')root.dataset.theme=stored}catch(e){}
 toggle.addEventListener('click',()=>{const next=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=next;try{localStorage.setItem('sk-theme',next)}catch(e){}});

 // Sends to the same response sheet as the old Google Form.
 // Apps Script web app URL (see scripts/contact-form.gs). Until it is set, messages go straight to the Google Form.
 const SCRIPT_URL='';
 const ENDPOINT='https://docs.google.com/forms/d/e/1FAIpQLScHgh8Q-Ls5zfvz0ktgKg1WLhbBu7xBwRSvC0_1UCD_PNFoLg/formResponse';
 const KEYS={'entry.581627351':'name','entry.1393482793':'email','entry.1542931193':'company','entry.1928615175':'message'};
 const form=document.getElementById('contact-form'), status=form.querySelector('.status'), send=form.querySelector('.send');
 form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(!form.reportValidity()) return;
  const data=new FormData(form);
  if(data.get('website')) return; // honeypot: bots fill hidden fields
  send.disabled=true; status.textContent='Sending…';
  try{
   if(SCRIPT_URL){
    const body={};
    for(const [k,field] of Object.entries(KEYS)) body[field]=data.get(k)||'';
    const res=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(body)}); // plain-text body: no CORS preflight
    const out=await res.json();
    if(!out.ok) throw new Error(out.error||'failed');
   }else{
    data.delete('website');
    // no-cors: Google does not allow reading the reply, so success is assumed once the request is sent
    await fetch(ENDPOINT,{method:'POST',mode:'no-cors',body:new URLSearchParams(data)});
   }
   form.reset();
   status.textContent='Thanks, your message has been sent.';
  }catch(err){
   status.textContent=err.message==='invalid'
    ? 'Please check your details and try again.'
    : 'Something went wrong. Please try again in a little while.';
  }finally{
   send.disabled=false;
  }
 });
})();
</script>
</body>
</html>
